<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>PH Volcanoes and Fault Lines by AL</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="data/VolcanoesofthePH_1.js"></script>
        <script src="data/PhilippinesActiveFaults_2.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[15.049531068252724,119.47831156620829],[16.32991740092529,121.69056708074437]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>PH Volcanoes and Fault Lines by AL</h2>';
        };
        title.addTo(map);
        var abstract = new L.Control({'position':'topright'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'
                this._div.setAttribute("onmouseenter", "abstract.show()");
                this._div.setAttribute("onmouseleave", "abstract.hide()");
                this.hide();
                return this._div;
            };
            abstract.hide = function () {
                this._div.classList.remove("abstractUncollapsed");
                this._div.classList.add("abstract");
                this._div.innerHTML = 'i'
            }
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = 'Point locations of active, potentially active, and inactive volcanoes across the Philippine archipelago as catalogued by PHIVOLCS. The Philippines hosts 24 active volcanoes, including Mayon, Taal, Pinatubo, Bulusan, and Kanlaon, making volcanic hazard awareness a national priority. This dataset supports volcanic hazard assessments, eruption scenario modeling, evacuation route planning, and land use restrictions around permanent danger zones designated by PHIVOLCS for each volcano. <br /><br />PH Fault Layer is also included. A layer representing the location of the active faults in the Philippines. To define, a fault is a break, fracture, fissure or zone of weakness where movement or displacement had occured or may occur again. An active fault is a fault that has moved within the last 10,000 years. It shows evidence or has documented history of its recent movement.';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_ESRIStandard_0');
        map.getPane('pane_ESRIStandard_0').style.zIndex = 400;
        var layer_ESRIStandard_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRIStandard_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_ESRIStandard_0;
        map.addLayer(layer_ESRIStandard_0);
        function pop_VolcanoesofthePH_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Volcano Name</th>\
                        <td>' + (feature.properties['d_volcno'] !== null ? autolinker.link(String(feature.properties['d_volcno']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Volcano Type Code</th>\
                        <td>' + (feature.properties['d_vtcode'] !== null ? autolinker.link(String(feature.properties['d_vtcode']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">created_da</th>\
                        <td>' + (feature.properties['created_da'] !== null ? autolinker.link(String(feature.properties['created_da']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">last_edi_1</th>\
                        <td>' + (feature.properties['last_edi_1'] !== null ? autolinker.link(String(feature.properties['last_edi_1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_VolcanoesofthePH_1_0(feature) {
            switch(String(feature.properties['d_vtcode'])) {
                case 'Active':
                    return {
                pane: 'pane_VolcanoesofthePH_1',
                interactive: true,
            }
                    break;
                case 'Potentially Active':
                    return {
                pane: 'pane_VolcanoesofthePH_1',
                interactive: true,
            }
                    break;
                case 'Inactive':
                    return {
                pane: 'pane_VolcanoesofthePH_1',
                interactive: true,
            }
                    break;
                case 'ND':
                    return {
                pane: 'pane_VolcanoesofthePH_1',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_VolcanoesofthePH_1');
        map.getPane('pane_VolcanoesofthePH_1').style.zIndex = 401;
        map.getPane('pane_VolcanoesofthePH_1').style['mix-blend-mode'] = 'normal';
        var layer_VolcanoesofthePH_1 = new L.geoJson(json_VolcanoesofthePH_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_VolcanoesofthePH_1',
            layerName: 'layer_VolcanoesofthePH_1',
            pane: 'pane_VolcanoesofthePH_1',
            onEachFeature: pop_VolcanoesofthePH_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_VolcanoesofthePH_1_0(feature));
            },
        });
        var cluster_VolcanoesofthePH_1 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_VolcanoesofthePH_1.addLayer(layer_VolcanoesofthePH_1);

        bounds_group.addLayer(layer_VolcanoesofthePH_1);
        cluster_VolcanoesofthePH_1.addTo(map);
        function pop_PhilippinesActiveFaults_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">DATEMAPPED</th>\
                        <td>' + (feature.properties['DATEMAPPED'] !== null ? autolinker.link(String(feature.properties['DATEMAPPED']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">SCALE</th>\
                        <td>' + (feature.properties['SCALE'] !== null ? autolinker.link(String(feature.properties['SCALE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">CATEGORY</th>\
                        <td>' + (feature.properties['CATEGORY'] !== null ? autolinker.link(String(feature.properties['CATEGORY']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">TRACETYPE</th>\
                        <td>' + (feature.properties['TRACETYPE'] !== null ? autolinker.link(String(feature.properties['TRACETYPE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">LINETYPE</th>\
                        <td>' + (feature.properties['LINETYPE'] !== null ? autolinker.link(String(feature.properties['LINETYPE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">last_edi_1</th>\
                        <td>' + (feature.properties['last_edi_1'] !== null ? autolinker.link(String(feature.properties['last_edi_1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Shape__Len</th>\
                        <td>' + (feature.properties['Shape__Len'] !== null ? autolinker.link(String(feature.properties['Shape__Len']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_PhilippinesActiveFaults_2_0() {
            return {
                pane: 'pane_PhilippinesActiveFaults_2',
                opacity: 1,
                color: 'rgba(225,89,137,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_PhilippinesActiveFaults_2');
        map.getPane('pane_PhilippinesActiveFaults_2').style.zIndex = 402;
        map.getPane('pane_PhilippinesActiveFaults_2').style['mix-blend-mode'] = 'normal';
        var layer_PhilippinesActiveFaults_2 = new L.geoJson(json_PhilippinesActiveFaults_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_PhilippinesActiveFaults_2',
            layerName: 'layer_PhilippinesActiveFaults_2',
            pane: 'pane_PhilippinesActiveFaults_2',
            onEachFeature: pop_PhilippinesActiveFaults_2,
            style: style_PhilippinesActiveFaults_2_0,
        });
        bounds_group.addLayer(layer_PhilippinesActiveFaults_2);
        map.addLayer(layer_PhilippinesActiveFaults_2);
        var overlaysTree = [
            {label: '<img src="legend/PhilippinesActiveFaults_2.png" /> Philippines Active Faults', layer: layer_PhilippinesActiveFaults_2},
            {label: 'Volcanoes of the PH<br /><table><tr><td style="text-align: center;"><img src="legend/VolcanoesofthePH_1_Active0.png" /></td><td>Active</td></tr><tr><td style="text-align: center;"><img src="legend/VolcanoesofthePH_1_PotentiallyActive1.png" /></td><td>Potentially Active</td></tr><tr><td style="text-align: center;"><img src="legend/VolcanoesofthePH_1_Inactive2.png" /></td><td>Inactive</td></tr><tr><td style="text-align: center;"><img src="legend/VolcanoesofthePH_1_ND3.png" /></td><td>ND</td></tr></table>', layer: cluster_VolcanoesofthePH_1},
            {label: "ESRI Standard", layer: layer_ESRIStandard_0, radioGroup: 'bm' },]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        </script>        
    </body>
</html>
